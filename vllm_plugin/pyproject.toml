[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctapp-vllm"
version = "0.1.0"
description = "vLLM plugin: CTA-pipelined TP4 down_proj -> add -> RMSNorm -> QKV boundary for Llama"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
ctapp = "ctapp_vllm:register"

[tool.setuptools]
packages = ["ctapp_vllm"]
